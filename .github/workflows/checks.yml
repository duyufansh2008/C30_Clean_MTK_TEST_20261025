name: C30 offline safety and launcher
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -v
      - run: python tools/update_manifest.py --check
      - run: python tools/verify_files.py --source
      - name: Windows CLI loads without accessing a device
        if: runner.os == 'Windows'
        shell: cmd
        run: MTK.cmd --help

  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the documented Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"'
      - name: Build and verify the production APK from outside the repository
        working-directory: /tmp
        run: python "$GITHUB_WORKSPACE/sources/build_launcher.py" --sdk "$ANDROID_HOME"
      - name: Build emulator checks separately from the production APK
        run: python sources/build_launcher.py --sdk "$ANDROID_HOME" --test --output sources/build/C30LauncherChecks.apk
      - name: Enable emulator acceleration on the CI runner
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r sources/build/C30LauncherChecks.apk
            adb shell am instrument -w com.fundot.p4bu/com.fundot.p4bu.LauncherChecks > /tmp/c30-launcher-checks.txt
            cat /tmp/c30-launcher-checks.txt
            grep -q 'c30_checks=passed' /tmp/c30-launcher-checks.txt
